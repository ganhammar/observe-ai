version = 0.1

# template_file is scoped to build only. Setting it globally would make sam
# deploy read the source template and package CodeUri verbatim, skipping the
# build output. Scoped here, deploy picks up .aws-sam/build/template.yaml and
# ships the built artifact.
[default.build.parameters]
template_file = "infra/template.yaml"

[default.validate.parameters]
template_file = "infra/template.yaml"

[default.deploy.parameters]
region = "eu-central-1"
stack_name = "observe-ai"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
