version = 0.1

# template_file is scoped to build only. Setting it globally makes sam deploy
# read the source template and package CodeUri verbatim, which skips the build
# output entirely. With it here, deploy picks up .aws-sam/build/template.yaml
# and ships what was actually built.
[default.build.parameters]
template_file = "infra/template.yaml"

[default.validate.parameters]
template_file = "infra/template.yaml"

[default.deploy.parameters]
region = "eu-central-1"
stack_name = "observe-ai"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
