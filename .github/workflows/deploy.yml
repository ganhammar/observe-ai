name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET tests
        run: dotnet test tests/ObserveAi.Tests --nologo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Python eval tests
        # The Python package holds the evaluation implementation; the deployed
        # implementation is in C#. Its tests run here because
        # tests/vectors/combine.json is generated from this package, and the
        # C# combining rule is checked against that file.
        run: |
          pip install -e ".[test]"
          pytest -q

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-24.04-arm
    # Two pushes in quick succession would otherwise race on the same stack,
    # and CloudFormation refuses an update while one is in progress.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Requires a GitHub Environment named "production" in this repository's
    # settings. Add required reviewers there to gate deploys on approval.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Deploy ingest stack
        # Account-wide capture into the Kinesis stream the app stack consumes.
        # Deployed first so its stream ARN can be handed to the app stack, and
        # a no-op when the template is unchanged.
        run: |
          STATUS="$(aws cloudformation describe-stacks --stack-name observe-ai-ingest \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || true)"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            # A first create that failed leaves a stack that can only be deleted.
            aws cloudformation delete-stack --stack-name observe-ai-ingest
            aws cloudformation wait stack-delete-complete --stack-name observe-ai-ingest
          fi
          if ! aws cloudformation deploy \
            --stack-name observe-ai-ingest \
            --template-file infra/ingest.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset; then
            aws cloudformation describe-stack-events --stack-name observe-ai-ingest \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId, ResourceStatusReason]" \
              --output table
            exit 1
          fi
          LOG_STREAM_ARN="$(aws cloudformation describe-stacks \
            --stack-name observe-ai-ingest \
            --query "Stacks[0].Outputs[?OutputKey=='LogStreamArn'].OutputValue | [0]" \
            --output text)"
          echo "LOG_STREAM_ARN=$LOG_STREAM_ARN" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install native toolchain
        # NativeAOT links with clang and lld; neither ships on the runner image.
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: sam build
        run: sam build

      - name: Check glibc requirement
        # provided.al2023 carries glibc 2.34. NativeAOT links against whatever
        # the builder has, so a runner image upgrade can raise the required
        # glibc version, and the failure would surface as a Lambda that cannot
        # start. This check fails the build first, with a clear message.
        run: |
          BIN=.aws-sam/build/TriageFunction/bootstrap
          if [ ! -f "$BIN" ]; then
            echo "::error::$BIN was not produced. provided.al2023 runs a file named bootstrap and nothing else."
            exit 1
          fi
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          if [ -z "$MAX" ]; then
            echo "::error::No GLIBC symbols found in $BIN; it is not the expected dynamically linked binary."
            exit 1
          fi
          echo "highest required symbol: $MAX"
          if [ "$(printf '%s\n' "$MAX" GLIBC_2.34 | sort -uV | tail -1)" != "GLIBC_2.34" ]; then
            echo "::error::Binary needs $MAX but provided.al2023 offers GLIBC_2.34."
            exit 1
          fi

      - name: Resolve imported model
        # Bedrock Custom Model Import is not a CloudFormation resource. The
        # model is created out of band by the Import Model workflow and looked
        # up here by name. Resolving it at deploy time means the stack cannot
        # point at a deleted model; a missing model fails here with a clear
        # message before the CLI call runs.
        env:
          MODEL_NAME: ${{ vars.MODEL_NAME || 'observe-ai' }}
        run: |
          MODEL_ARN="$(aws bedrock list-imported-models \
            --region eu-central-1 \
            --name-contains "$MODEL_NAME" \
            --query "modelSummaries[?modelName=='$MODEL_NAME'].modelArn | [0]" \
            --output text)"
          if [ -z "$MODEL_ARN" ] || [ "$MODEL_ARN" = "None" ]; then
            echo "::error::No imported Bedrock model named '$MODEL_NAME' in eu-central-1. Run the Import Model workflow first."
            exit 1
          fi
          echo "Resolved $MODEL_NAME to $MODEL_ARN"
          echo "MODEL_ARN=$MODEL_ARN" >> "$GITHUB_ENV"

      - name: sam deploy
        env:
          ORG: ${{ vars.GITHUB_ORG }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ModelArn=$MODEL_ARN" "GitHubOrg=${ORG:-ganhammar}" "LogStreamArn=$LOG_STREAM_ARN"

      - name: Store GitHub token
        # The stack owns the secret; this writes the repository secret into it,
        # only when it differs from what is stored, so an unchanged token does
        # not mint a new secret version on every deploy.
        env:
          TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GH_ISSUES_TOKEN is not set; the pipeline cannot read source or file issues until it is."
            exit 0
          fi
          SECRET_ARN="$(aws cloudformation describe-stacks \
            --stack-name observe-ai \
            --query "Stacks[0].Outputs[?OutputKey=='GitHubTokenSecretArn'].OutputValue | [0]" \
            --output text)"
          CURRENT="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
            --query SecretString --output text 2>/dev/null || true)"
          if [ "$CURRENT" = "$TOKEN" ]; then
            echo "Token unchanged"
          else
            aws secretsmanager put-secret-value --secret-id "$SECRET_ARN" --secret-string "$TOKEN" >/dev/null
            echo "Token stored"
          fi
