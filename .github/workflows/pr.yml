name: PR Checks

on:
  pull_request: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET tests
        run: dotnet test tests/ObserveAi.Tests --nologo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Python eval tests
        # The Python package holds the evaluation implementation; the deployed
        # implementation is in C#. Its tests run here because
        # tests/vectors/combine.json is generated from this package, and the
        # C# combining rule is checked against that file.
        run: |
          pip install -e ".[test]"
          pytest -q
