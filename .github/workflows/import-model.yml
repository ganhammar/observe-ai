name: Import Model

# One-time bootstrap. Bedrock Custom Model Import is not supported by
# CloudFormation, so the imported model cannot be a stack resource and is
# created here instead. Everything around it is: this workflow deploys the
# bootstrap stack (staging bucket and Bedrock import role) and reads the
# bucket and role straight off its outputs, so there is nothing to create
# by hand and nothing to paste between steps.
#
# Manual trigger only: the job downloads several GB of weights, and the
# imported model it produces carries a monthly per-CMU storage charge until
# it is deleted. Re-running is safe and cheap, since the script exits early
# when a model of the target name already exists.

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: HuggingFace model id to import
        required: false
        default: Qwen/Qwen3-4B
        type: string
      model_name:
        description: Imported model name, and the key Deploy looks it up by
        required: false
        default: observe-ai
        type: string

concurrency:
  # Two imports of the same model racing would create duplicate billable copies.
  group: import-model-${{ inputs.model_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  BOOTSTRAP_STACK: observe-ai-bootstrap

jobs:
  import:
    name: Import
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Deploy bootstrap stack
        run: |
          aws cloudformation deploy \
            --stack-name "$BOOTSTRAP_STACK" \
            --template-file infra/bootstrap.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Read bootstrap outputs
        run: |
          read_output() {
            aws cloudformation describe-stacks \
              --stack-name "$BOOTSTRAP_STACK" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          BUCKET="$(read_output StagingBucketName)"
          IMPORT_ROLE="$(read_output ModelImportRoleArn)"
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ] || [ -z "$IMPORT_ROLE" ] || [ "$IMPORT_ROLE" = "None" ]; then
            echo "::error::Bootstrap stack did not report a staging bucket and import role."
            exit 1
          fi
          echo "Staging bucket: $BUCKET"
          echo "Import role: $IMPORT_ROLE"
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "IMPORT_ROLE=$IMPORT_ROLE" >> "$GITHUB_ENV"

      - name: Install the hf CLI
        # The hf entrypoint ships in the base package; the old cli extra is gone.
        run: pip install --upgrade huggingface_hub

      - name: Report free disk space
        # Weights are staged to the runner before the S3 sync, so a full disk
        # is the most likely way this job fails.
        run: df -h /

      - name: Run import
        # Inputs are passed through the environment rather than interpolated
        # into the script body, so a value containing shell metacharacters is
        # data to the script instead of syntax to the runner shell.
        env:
          MODEL_ID: ${{ inputs.model_id }}
          MODEL_NAME: ${{ inputs.model_name }}
        run: |
          ./infra/import-model.sh \
            --model-id "$MODEL_ID" \
            --bucket "$BUCKET" \
            --role-arn "$IMPORT_ROLE" \
            --job-name "$MODEL_NAME" \
            --region "$AWS_REGION"

      - name: Report imported model
        env:
          MODEL_NAME: ${{ inputs.model_name }}
        run: |
          MODEL_ARN="$(aws bedrock list-imported-models \
            --region "$AWS_REGION" \
            --name-contains "$MODEL_NAME" \
            --query "modelSummaries[?modelName=='$MODEL_NAME'].modelArn | [0]" \
            --output text)"
          echo "### Imported model" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$MODEL_ARN" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy resolves this by name, so no variable needs updating." >> "$GITHUB_STEP_SUMMARY"
