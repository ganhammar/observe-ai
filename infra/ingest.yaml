AWSTemplateFormatVersion: '2010-09-09'
Description: >
  observe-ai ingestion. Captures every log group in the account into a Kinesis
  stream. Separate from the application stack because it is account-wide and
  rarely changes; the Deploy workflow deploys it ahead of the application
  stack, which is a no-op when nothing here changed.

Parameters:
  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >
      One shard carries 1 MB/s or 1000 records/s. Raise it for a noisy account.
  ExcludedLogGroupNames:
    Type: CommaDelimitedList
    Default: /aws/lambda/observe-ai-TriageFunction,/aws/vendedlogs/states/observe-ai-TriagePipeline
    Description: >
      Exact log group names not captured; this is the recursion guard. This
      stack does not know the application stack's resource names, so the
      exclusion list is a parameter, not a computed prefix. The default
      matches what infra/template.yaml's TriageFunction and TriagePipeline
      create under the default stack name observe-ai; override it to match
      if either is deployed under a different stack name.
  RetentionHours:
    Type: Number
    Default: 24
    MinValue: 24
    Description: Hours a record survives in the stream if nothing consumes it.

Resources:
  LogStream:
    Type: AWS::Kinesis::Stream
    Properties:
      StreamModeDetails:
        StreamMode: PROVISIONED
      ShardCount: !Ref ShardCount
      RetentionPeriodHours: !Ref RetentionHours
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # CloudWatch Logs delivers into the stream under this role.
  DeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringLike:
                aws:SourceArn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: WriteToLogStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                Resource: !GetAtt LogStream.Arn

  # One policy captures every log group in the account, including ones created
  # after this deploys, so the service works without being told about each
  # new service.
  #
  # This pipeline writes logs of its own: the triage Lambda's own log group,
  # and the state machine's execution log group. Capturing either would make
  # triaging a log produce a log that triggers triage, which AWS documents as
  # a way to run up ingestion billing. Both are excluded here by exact name.
  CaptureAllLogGroups:
    Type: AWS::Logs::AccountPolicy
    Properties:
      PolicyName: observe-ai-capture
      PolicyType: SUBSCRIPTION_FILTER_POLICY
      Scope: ALL
      SelectionCriteria: !Join
        - ''
        - - 'LogGroupName NOT IN ["'
          - !Join
              - '", "'
              - !Ref ExcludedLogGroupNames
          - '"]'
      PolicyDocument: !Sub |
        {
          "DestinationArn": "${LogStream.Arn}",
          "RoleArn": "${DeliveryRole.Arn}",
          "FilterPattern": "?ERROR ?Error ?error ?Exception ?Traceback ?\"panic:\"",
          "Distribution": "ByLogStream"
        }

Outputs:
  LogStreamArn:
    Description: Stream the batch reader consumes.
    Value: !GetAtt LogStream.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LogStreamArn
  LogStreamName:
    Value: !Ref LogStream
    Export:
      Name: !Sub ${AWS::StackName}-LogStreamName
