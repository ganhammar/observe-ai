AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  observe-ai - first-pass triage of application error logs. A Lambda function
  builds a decision request and calls Amazon Bedrock Custom Model Import (an
  imported Qwen3 model) for option log probabilities, returning calibrated-
  style probabilities as JSON. Deployed to eu-central-1 for EU data
  residency, since that is a region where Bedrock Custom Model Import runs.

Parameters:
  ModelArn:
    Type: String
    Description: >
      ARN of the Bedrock Custom Model Import model the function invokes,
      for example arn:aws:bedrock:eu-central-1:123456789012:imported-model/abcdef1234.
      Produced once by infra/import-model.sh; there is no default because
      the function is not usable without a real imported model.
    AllowedPattern: '^arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:imported-model/.+$'
    ConstraintDescription: Must be a Bedrock imported-model ARN.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Python logging level passed to the function as LOG_LEVEL.
  SemifMode:
    Type: String
    Default: tree
    AllowedValues:
      - tree
      - flat
    Description: >
      tree asks the seven grounded signals and combines them in code. flat asks
      one causal question, which is the path the published baseline measured.
  IssuesPerRepoPerHour:
    Type: Number
    Default: 5
    Description: >
      Caps.TryConsumeAsync's per-repository hourly limit on filed issues.
      Occurrences past this roll into one incident issue instead of each
      opening their own.
  IssuesPerHour:
    Type: Number
    Default: 20
    Description: >
      Caps.TryConsumeAsync's hourly limit across every repository combined.
      Crossing it trips the breaker: nothing files and the caller notifies
      instead.
  LogStreamArn:
    Type: String
    Default: ''
    Description: >
      ARN of the ingest stack's Kinesis stream (infra/ingest.yaml's
      LogStreamArn output). Taken as a parameter rather than imported since
      the ingest and application stacks deploy independently. Empty when the
      ingest stack does not exist yet, in which case the function deploys
      without the Kinesis trigger rather than failing.
    AllowedPattern: '^$|^arn:aws:kinesis:[a-z0-9-]+:[0-9]{12}:stream/.+$'
    ConstraintDescription: Must be empty or a Kinesis stream ARN.
  GitHubTokenSecretArn:
    Type: String
    Default: ''
    Description: >
      ARN of the Secrets Manager secret holding the GitHub token IssueFiler
      uses to file and comment on issues. Created out of band; this stack
      only reads it. Empty means no token is configured, in which case the
      function deploys without permission to read one and filing is not
      permitted rather than the stack refusing to deploy.
    AllowedPattern: '^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be empty or a Secrets Manager secret ARN.
  GitHubOrg:
    Type: String
    Default: ganhammar
    Description: >
      GitHub organisation ServiceIdentity.ConventionalRepo combines with a
      log group's own resource name to name the repository owning it, for
      example {GitHubOrg}/billing-sync for /aws/lambda/billing-sync.

Conditions:
  HasLogStream: !Not [!Equals [!Ref LogStreamArn, '']]
  HasGitHubToken: !Not [!Equals [!Ref GitHubTokenSecretArn, '']]

Resources:
  TriageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # The .NET NativeAOT publish runs through a Makefile because SAM's own
      # dotnet workflow packages a managed assembly, not a native binary.
      BuildMethod: makefile
    Properties:
      CodeUri: ../src/ObserveAi
      # Explicit rather than SAM-generated, so the log group this function
      # writes to (named from it below) is known at template-authoring time
      # instead of only after deploy. infra/ingest.yaml's account capture
      # policy excludes that log group by exact name, which only works if
      # the name is predictable.
      FunctionName: !Sub ${AWS::StackName}-TriageFunction
      # provided.al2023 ignores Handler and runs the bootstrap binary, but
      # CloudFormation still requires the property to be present.
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      # The function does no inference locally: it assembles a small JSON
      # request and waits on a Bedrock InvokeModel call. A NativeAOT binary
      # has no JIT and no managed heap to warm, so the floor is low. 512 MB
      # is above what the payload needs and buys CPU share for the TLS
      # handshake, which is most of a run this thin.
      MemorySize: 512
      # A cold Bedrock Custom Model Import target can take longer than a
      # typical managed-model InvokeModel call to respond, particularly
      # when the imported model copy has scaled to zero after 5 minutes of
      # no traffic and has to reactivate. 60 seconds gives that reactivation
      # path, plus normal inference latency and retries, room to complete
      # without the Lambda timing out first.
      Timeout: 60
      Environment:
        Variables:
          MODEL_ARN: !Ref ModelArn
          BEDROCK_REGION: !Ref AWS::Region
          LOG_LEVEL: !Ref LogLevel
          SEMIF_MODE: !Ref SemifMode
          SEEN_TABLE: !Ref SeenTable
          GITHUB_ORG: !Ref GitHubOrg
          RATE_TABLE: !Ref RateTable
          ISSUES_PER_REPO_PER_HOUR: !Ref IssuesPerRepoPerHour
          ISSUES_PER_HOUR: !Ref IssuesPerHour
          # Built rather than !Ref TriagePipeline: the pipeline's own definition
          # already takes a hard dependency on this function's ARN (as the Task
          # resource for every step), so a Ref back the other way would make the
          # two resources circular. TriagePipeline's explicit Name below is what
          # makes this ARN predictable without one.
          PIPELINE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-TriagePipeline
          GITHUB_TOKEN_SECRET_ARN: !Ref GitHubTokenSecretArn
      # No Events here: SAM's Events sugar only makes an event source
      # conditional by way of the function resource's own Condition, not a
      # Condition on the individual event, so it cannot express "this
      # function always exists, but its Kinesis trigger only exists when a
      # stream is configured". TriageFunctionLogStreamMapping below is that
      # trigger, written as a plain CloudFormation resource so its own
      # Condition applies to it directly.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeImportedModelOnly
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref ModelArn
            - Sid: CountOccurrencesOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt SeenTable.Arn
            - Sid: IncrementRateCountersOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt RateTable.Arn
            # Held by the Kinesis-triggered consumer, which starts one execution
            # per unpacked log event rather than running the pipeline inline.
            # Same built ARN as PIPELINE_ARN above, for the same reason.
            - Sid: StartTriagePipelineOnly
              Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-TriagePipeline
      # Beyond the Kinesis trigger (TriageFunctionLogStreamMapping below), the
      # only other caller is the state machine invoking this function directly
      # through the Invoke API, not a public HTTP endpoint. Add a key under
      # Events above only if that stops being true, for example:
      #
      # TriageApi:
      #   Type: Api
      #   Properties:
      #     Path: /triage
      #     Method: post
      #
      # A function URL is the lighter-weight alternative to a full API
      # Gateway when the caller is still inside AWS (e.g. same account,
      # or with IAM SigV4 signing) and does not need routing, throttling
      # plans, or a custom domain:
      #
      # FunctionUrlConfig:
      #   AuthType: AWS_IAM

  # CloudWatch Logs delivers into this stream account-wide (infra/ingest.yaml);
  # each record can batch many log events, and LogEnvelope.Unpack turns each
  # into one pipeline execution. A poisonous record bisects out of its batch
  # and is retried at most twice, rather than blocking everything behind it on
  # the shard. Absent, rather than deploy failing, when no stream is
  # configured yet.
  TriageFunctionLogStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasLogStream
    Properties:
      EventSourceArn: !Ref LogStreamArn
      FunctionName: !Ref TriageFunction
      BatchSize: 10
      StartingPosition: LATEST
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 2

  # The permissions a polling Kinesis event source mapping needs to read the
  # stream, scoped to it rather than the AWSLambdaKinesisExecutionRole managed
  # policy's "*" resource. Its own resource, conditioned the same way as the
  # mapping above, for the same reason a Policies statement cannot carry a
  # Condition by itself.
  TriageFunctionKinesisPolicy:
    Type: AWS::IAM::Policy
    Condition: HasLogStream
    Properties:
      PolicyName: PollLogStreamOnly
      Roles:
        - !Ref TriageFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PollLogStreamOnly
            Effect: Allow
            Action:
              - kinesis:DescribeStream
              - kinesis:DescribeStreamSummary
              - kinesis:GetRecords
              - kinesis:GetShardIterator
              - kinesis:ListShards
              - kinesis:ListStreams
            Resource: !Ref LogStreamArn

  # Counts occurrences per distinct failure. The triage tree costs nine model
  # calls, so it runs on first sighting only; every repeat after that is an
  # increment. Keyed by repository as well as fingerprint, because the same
  # framework exception from two services is two defects.
  SeenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo
          AttributeType: S
        - AttributeName: fingerprint
          AttributeType: S
      KeySchema:
        - AttributeName: repo
          KeyType: HASH
        - AttributeName: fingerprint
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Two hourly rate counters share this table under one partition key: a
  # per-repository budget and, across the same hour, a global one covering
  # every repository. An hour bucket has no value the next day, so it expires
  # by then rather than accumulating forever.
  RateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bucket
          AttributeType: S
      KeySchema:
        - AttributeName: bucket
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  TriageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TriageFunction}
      RetentionInDays: 30

  # A Policies entry on the function itself cannot carry a Condition, only the
  # whole statement list can be included or not, so the GitHub token read is
  # its own resource instead. Without a token this is skipped entirely and
  # TriageFunction's role has no secretsmanager access at all, which is what
  # makes filing unpermitted rather than the stack failing to deploy.
  TriageFunctionGitHubTokenPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGitHubToken
    Properties:
      PolicyName: ReadGitHubTokenOnly
      Roles:
        - !Ref TriageFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadGitHubTokenOnly
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref GitHubTokenSecretArn

  # Drives one log event from ingest to an issue, or to a stop with a reason
  # (infra/pipeline.asl.json). STANDARD, not EXPRESS, because the execution
  # history is the audit trail for why a log did or did not become an issue,
  # and that history is only kept for standard executions. ALL-level logging
  # to CloudWatch Logs is the same audit trail for the states a completed
  # execution passed through, without having to open the execution in the
  # console. The machine calls DynamoDB directly for CountOccurrence, so its
  # role needs dynamodb:UpdateItem on SeenTable in addition to permission to
  # invoke TriageFunction for every other step.
  TriagePipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Named explicitly so TriageFunction can build this machine's ARN with
      # Fn::Sub instead of a Ref, which would make the two resources circular.
      Name: !Sub ${AWS::StackName}-TriagePipeline
      Type: STANDARD
      DefinitionUri: pipeline.asl.json
      DefinitionSubstitutions:
        TriageFunctionArn: !GetAtt TriageFunction.Arn
      Logging:
        Level: ALL
        # Off deliberately: the execution input is the log line that started
        # this execution, and logging it back out is what closes the
        # self-ingestion loop even with the account policy's exclusions in
        # place. State transitions are still recorded at ALL level; only the
        # payload carried between them is not.
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt TriagePipelineLogGroup.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeTriageFunctionOnly
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt TriageFunction.Arn
            - Sid: CountOccurrencesOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt SeenTable.Arn
            # Step Functions delivers execution history to CloudWatch Logs through
            # the account's log delivery configuration rather than a plain
            # logs:PutLogEvents call, and that delivery API only accepts '*' as a
            # resource; this is the AWS-documented policy shape for it.
            - Sid: DeliverExecutionHistoryToCloudWatchLogs
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'

  TriagePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-TriagePipeline
      RetentionInDays: 30

Outputs:
  TriageFunctionArn:
    Description: ARN of the triage Lambda function.
    Value: !GetAtt TriageFunction.Arn
  TriageFunctionName:
    Description: Name of the triage Lambda function.
    Value: !Ref TriageFunction
  TriagePipelineArn:
    Description: ARN of the triage pipeline state machine.
    Value: !Ref TriagePipeline
