AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  observe-ai - first-pass triage of application error logs. A Lambda function
  builds a decision request and calls Amazon Bedrock Custom Model Import (an
  imported Qwen3 model) for option log probabilities, returning calibrated-
  style probabilities as JSON. Deployed to eu-central-1 for EU data
  residency, since that is a region where Bedrock Custom Model Import runs.

Parameters:
  ModelArn:
    Type: String
    Description: >
      ARN of the Bedrock Custom Model Import model the function invokes,
      for example arn:aws:bedrock:eu-central-1:123456789012:imported-model/abcdef1234.
      Produced once by infra/import-model.sh; there is no default because
      the function is not usable without a real imported model.
    AllowedPattern: '^arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:imported-model/.+$'
    ConstraintDescription: Must be a Bedrock imported-model ARN.
  DiagnosisModelId:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
    AllowedPattern: '^eu\.[a-z0-9-]+\..+$'
    ConstraintDescription: >
      Must be an EU cross-region inference profile ID (eu.<provider>.<model>).
    Description: >
      Managed Bedrock model Diagnosis.DiagnoseAsync reads source with when an
      issue is about to be filed. The eu. profile is required: the bare model
      ID is not enabled for on-demand invocation in this region, and the
      profile keeps the request inside EU regions.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Python logging level passed to the function as LOG_LEVEL.
  SemifMode:
    Type: String
    Default: tree
    AllowedValues:
      - tree
      - flat
    Description: >
      tree asks the seven grounded signals and combines them in code. flat asks
      one causal question, which is the path the published baseline measured.
  IssuesPerRepoPerHour:
    Type: Number
    Default: 5
    Description: >
      Caps.TryConsumeAsync's per-repository hourly limit on filed issues.
      Occurrences past this roll into one incident issue; none of them opens
      its own.
  IssuesPerHour:
    Type: Number
    Default: 20
    Description: >
      Caps.TryConsumeAsync's hourly limit across every repository combined.
      Crossing it trips the breaker: nothing files and the caller notifies
      instead.
  LogStreamArn:
    Type: String
    Default: ''
    Description: >
      ARN of the ingest stack's Kinesis stream (infra/ingest.yaml's
      LogStreamArn output). The ingest and application stacks deploy
      independently, so this is a parameter, not a stack import. Empty when
      the ingest stack does not exist yet; the function then deploys without
      the Kinesis trigger.
    AllowedPattern: '^$|^arn:aws:kinesis:[a-z0-9-]+:[0-9]{12}:stream/.+$'
    ConstraintDescription: Must be empty or a Kinesis stream ARN.
  GitHubOrg:
    Type: String
    Default: ganhammar
    Description: >
      GitHub organisation ServiceIdentity.ConventionalRepo combines with a
      log group's own resource name to name the repository owning it, for
      example {GitHubOrg}/billing-sync for /aws/lambda/billing-sync.

Conditions:
  HasLogStream: !Not [!Equals [!Ref LogStreamArn, '']]

Resources:
  TriageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # The .NET NativeAOT publish runs through a Makefile because SAM's own
      # dotnet workflow packages a managed assembly, not a native binary.
      BuildMethod: makefile
    Properties:
      CodeUri: ../src/ObserveAi
      # FunctionName is explicit, so the log group this function writes to
      # (named from it below) is known at template-authoring time.
      # infra/ingest.yaml's account capture policy excludes that log group
      # by exact name, which requires the name to be predictable.
      FunctionName: !Sub ${AWS::StackName}-TriageFunction
      # provided.al2023 ignores Handler and runs the bootstrap binary, but
      # CloudFormation still requires the property to be present.
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      # The function does no inference locally: it assembles a small JSON
      # request and waits on a Bedrock InvokeModel call. A NativeAOT binary
      # has no JIT and no managed heap to warm, so the floor is low. 512 MB
      # is above what the payload needs and buys CPU share for the TLS
      # handshake, which is most of a run this thin.
      MemorySize: 512
      # A cold Bedrock Custom Model Import target can take longer than a
      # typical managed-model InvokeModel call to respond, particularly
      # when the imported model copy has scaled to zero after 5 minutes of
      # no traffic and has to reactivate. 60 seconds gives that reactivation
      # path, plus normal inference latency and retries, room to complete
      # without the Lambda timing out first. Escalate additionally fetches up
      # to five files from GitHub and waits on one generative call.
      Timeout: 90
      Environment:
        Variables:
          MODEL_ARN: !Ref ModelArn
          DIAGNOSIS_MODEL_ID: !Ref DiagnosisModelId
          BEDROCK_REGION: !Ref AWS::Region
          LOG_LEVEL: !Ref LogLevel
          SEMIF_MODE: !Ref SemifMode
          SEEN_TABLE: !Ref SeenTable
          GITHUB_ORG: !Ref GitHubOrg
          RATE_TABLE: !Ref RateTable
          ISSUES_PER_REPO_PER_HOUR: !Ref IssuesPerRepoPerHour
          ISSUES_PER_HOUR: !Ref IssuesPerHour
          # PIPELINE_ARN is built with Fn::Sub because a !Ref to TriagePipeline
          # would make the two resources circular: the pipeline's own definition
          # already depends on this function's ARN as the Task resource for
          # every step. TriagePipeline's explicit Name below makes this ARN
          # predictable.
          PIPELINE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-TriagePipeline
          GITHUB_TOKEN_SECRET_ARN: !Ref GitHubToken
      # No Events here. SAM's Events sugar can make an event source
      # conditional only through the function resource's own Condition, not
      # through a Condition on the individual event, so it cannot express a
      # function that always exists with a Kinesis trigger that exists only
      # when a stream is configured. TriageFunctionLogStreamMapping below is
      # that trigger, written as a plain CloudFormation resource so its
      # Condition applies directly to it.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeImportedModelOnly
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref ModelArn
            # A cross-region profile needs the profile itself plus the underlying
            # foundation model in every region it may route to, which for an eu.
            # profile is every EU region. The model ID is the profile ID with
            # its geo prefix removed.
            - Sid: InvokeDiagnosisModelOnly
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${DiagnosisModelId}
                - !Sub
                  - arn:aws:bedrock:eu-*::foundation-model/${FoundationModelId}
                  - FoundationModelId: !Select [1, !Split ['eu.', !Ref DiagnosisModelId]]
            - Sid: ReadGitHubTokenOnly
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GitHubToken
            - Sid: CountOccurrencesOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt SeenTable.Arn
            - Sid: IncrementRateCountersOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt RateTable.Arn
            # Held by the Kinesis-triggered consumer, which starts one execution
            # per unpacked log event. Uses the same built ARN as PIPELINE_ARN
            # above, for the same reason.
            - Sid: StartTriagePipelineOnly
              Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-TriagePipeline
      # Beyond the Kinesis trigger (TriageFunctionLogStreamMapping below), the
      # only other caller is the state machine invoking this function directly
      # through the Invoke API; there is no public HTTP endpoint. Add a key
      # under Events above only if that changes, for example:
      #
      # TriageApi:
      #   Type: Api
      #   Properties:
      #     Path: /triage
      #     Method: post
      #
      # A function URL is a lighter-weight option than a full API Gateway
      # when the caller is inside AWS (e.g. same account, or with IAM SigV4
      # signing) and does not need routing, throttling plans, or a custom
      # domain:
      #
      # FunctionUrlConfig:
      #   AuthType: AWS_IAM

  # CloudWatch Logs delivers into this stream account-wide (infra/ingest.yaml).
  # Each record can batch many log events, and LogEnvelope.Unpack turns each
  # into one pipeline execution. A poisonous record bisects out of its batch
  # and retries at most twice without blocking the shard behind it. This
  # mapping is absent, not a deploy failure, when no stream is configured yet.
  TriageFunctionLogStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasLogStream
    Properties:
      EventSourceArn: !Ref LogStreamArn
      FunctionName: !Ref TriageFunction
      BatchSize: 10
      StartingPosition: LATEST
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 2

  # Grants a polling Kinesis event source mapping only the permissions needed
  # to read this stream, scoped to its ARN; the AWSLambdaKinesisExecutionRole
  # managed policy scopes the same actions to "*". This is its own resource,
  # conditioned the same way as the mapping above, because a Policies
  # statement cannot carry a Condition by itself.
  TriageFunctionKinesisPolicy:
    Type: AWS::IAM::Policy
    Condition: HasLogStream
    Properties:
      PolicyName: PollLogStreamOnly
      Roles:
        - !Ref TriageFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PollLogStreamOnly
            Effect: Allow
            Action:
              - kinesis:DescribeStream
              - kinesis:DescribeStreamSummary
              - kinesis:GetRecords
              - kinesis:GetShardIterator
              - kinesis:ListShards
              - kinesis:ListStreams
            Resource: !Ref LogStreamArn

  # Counts occurrences per distinct failure. The triage tree costs nine model
  # calls, so it runs on first sighting only; every repeat after that is an
  # increment. Keyed by repository as well as fingerprint, because the same
  # framework exception from two services is two defects.
  SeenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo
          AttributeType: S
        - AttributeName: fingerprint
          AttributeType: S
      KeySchema:
        - AttributeName: repo
          KeyType: HASH
        - AttributeName: fingerprint
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Two hourly rate counters share this table under one partition key: a
  # per-repository budget and, across the same hour, a global one covering
  # every repository. An hour bucket has no value the next day, so it
  # expires by then.
  RateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bucket
          AttributeType: S
      KeySchema:
        - AttributeName: bucket
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  TriageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TriageFunction}
      RetentionInDays: 30

  # The GitHub token IssueFiler files with and SourceFetch reads with. The
  # stack creates the secret with no value; the Deploy workflow writes the
  # token into it from the repository secret GH_ISSUES_TOKEN. With no value
  # stored, reading it fails and filing fails with that error.
  GitHubToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/github-token
      Description: Fine-grained GitHub token with Contents read and Issues write on the repositories this pipeline files against.

  # Drives one log event from ingest to an issue, or to a stop with a reason
  # (infra/pipeline.asl.json). This is a STANDARD state machine: standard
  # executions keep execution history, which is the audit trail for whether
  # a log became an issue; EXPRESS executions do not keep it. ALL-level
  # logging to CloudWatch Logs records the states a completed execution
  # passed through, without needing to open the execution in the console.
  # The machine calls DynamoDB directly for CountOccurrence, so its role
  # needs dynamodb:UpdateItem on SeenTable in addition to permission to
  # invoke TriageFunction for every other step.
  TriagePipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Named explicitly so TriageFunction can build this machine's ARN with
      # Fn::Sub. A Ref here would make the two resources circular.
      Name: !Sub ${AWS::StackName}-TriagePipeline
      Type: STANDARD
      DefinitionUri: pipeline.asl.json
      DefinitionSubstitutions:
        TriageFunctionArn: !GetAtt TriageFunction.Arn
      Logging:
        Level: ALL
        # IncludeExecutionData is false: the execution input is the log line
        # that started this execution, and logging it back out would close
        # the self-ingestion loop even with the account policy's exclusions
        # in place. State transitions are still recorded at ALL level; only
        # the payload carried between them is not.
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt TriagePipelineLogGroup.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeTriageFunctionOnly
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt TriageFunction.Arn
            - Sid: CountOccurrencesOnly
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt SeenTable.Arn
            # Step Functions delivers execution history to CloudWatch Logs through
            # the account's log delivery configuration. This delivery API accepts
            # only '*' as the resource; this is the AWS-documented policy shape
            # required for it.
            - Sid: DeliverExecutionHistoryToCloudWatchLogs
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'

  TriagePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-TriagePipeline
      RetentionInDays: 30

Outputs:
  TriageFunctionArn:
    Description: ARN of the triage Lambda function.
    Value: !GetAtt TriageFunction.Arn
  TriageFunctionName:
    Description: Name of the triage Lambda function.
    Value: !Ref TriageFunction
  TriagePipelineArn:
    Description: ARN of the triage pipeline state machine.
    Value: !Ref TriagePipeline
  GitHubTokenSecretArn:
    Description: Secret the Deploy workflow writes the GitHub token into.
    Value: !Ref GitHubToken
